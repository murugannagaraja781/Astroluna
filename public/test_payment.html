<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhonePe Test Payment</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: #5f259f;
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 1rem;
            background: #5f259f;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #4a1d7d;
        }

        #status {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>PhonePe Test</h1>
        <div class="input-group">
            <label for="userId">User ID</label>
            <input type="text" id="userId" value="DEMO_USER_123">
        </div>
        <div class="input-group">
            <label for="amount">Amount (INR)</label>
            <input type="number" id="amount" value="1">
        </div>
        <button onclick="initiatePayment()">Pay Now</button>
        <div id="status"></div>
    </div>

    <script>
        async function initiatePayment() {
            const userId = document.getElementById('userId').value;
            const amount = document.getElementById('amount').value;
            const statusDiv = document.getElementById('status');

            statusDiv.innerText = "Processing...";

            try {
                const response = await fetch('/api/phonepe/init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, amount })
                });

                const result = await response.json();

                if (result.ok && result.data && result.data.instrumentResponse && result.data.instrumentResponse.redirectInfo) {
                    statusDiv.innerHTML = '<span style="color: green">Success! Redirecting...</span>';
                    window.location.href = result.data.instrumentResponse.redirectInfo.url;
                } else {
                    statusDiv.innerHTML = '<span style="color: red">Error: ' + (result.error || 'Check server logs') + '</span>';
                    console.error(result);
                }
            } catch (err) {
                statusDiv.innerHTML = '<span style="color: red">Error: ' + err.message + '</span>';
            }
        }
    </script>
</body>

</html>
